name: Update grok-build

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-grok-build
  cancel-in-progress: false

env:
  TARGET_BRANCH: grok-build-intel-mac-release-26.05
  NIX_PATH: nixpkgs=${{ github.workspace }}

jobs:
  update:
    if: github.repository == '1eedaegon/nixpkgs'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update package
        id: update
        run: |
          old_version="$(nix-instantiate --eval --raw -E 'with import ./. {}; grok-build.version or (lib.getVersion grok-build)')"
          ./pkgs/by-name/gr/grok-build/update.sh
          new_version="$(nix-instantiate --eval --raw -E 'with import ./. {}; grok-build.version or (lib.getVersion grok-build)')"

          {
            echo "old_version=${old_version}"
            echo "new_version=${new_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- pkgs/by-name/gr/grok-build; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package
        if: steps.changes.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix-instantiate --eval --strict -E 'let pkgs = import ./. { system = "x86_64-darwin"; config.allowUnfree = true; config.allowDeprecatedx86_64Darwin = true; }; in { version = pkgs.grok-build.version; platforms = pkgs.grok-build.meta.platforms; }'
          nix-build -A grok-build --argstr system x86_64-linux --no-out-link
          git diff --check -- pkgs/by-name/gr/grok-build

      - name: Commit and push update
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [[ "${{ steps.update.outputs.old_version }}" == "${{ steps.update.outputs.new_version }}" ]]; then
            message="grok-build: refresh ${{ steps.update.outputs.new_version }}"
          else
            message="grok-build: ${{ steps.update.outputs.old_version }} -> ${{ steps.update.outputs.new_version }}"
          fi

          git add pkgs/by-name/gr/grok-build
          git commit -m "${message}"
          git push origin "HEAD:${TARGET_BRANCH}"
